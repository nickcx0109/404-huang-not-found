<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第一關之前的漫畫：前情提要</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
/* 1960 年代美漫的四色印刷：墨黑、泛黃的紙、復古紅、亮黃、深藍、橘 */
:root{--ink:#17120e;--paper:#f1e3bf;--red:#cf2a1d;--yel:#f8c61a;--blu:#1f4aa0;--org:#e8782a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0c0c0c;overflow:hidden;font-family:"PingFang TC","Heiti TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;cursor:pointer;background:var(--ink)}
#shake{position:absolute;inset:0}
#shake.thud{animation:thud .24s steps(4)}
@keyframes thud{0%{transform:translate(0,9px)}33%{transform:translate(-6px,-4px)}66%{transform:translate(4px,2px)}100%{transform:none}}

/* 頁面與格子 */
.page{position:absolute;inset:0;background-color:var(--paper);
  transition:transform .75s cubic-bezier(.6,0,.85,.35)}
.page.gone{transform:translate(-106%,60px) rotate(-8deg)}
.notrans,.notrans *{transition:none!important}
.panel{position:absolute;left:0;top:0;width:1600px;height:900px;background:var(--ink);opacity:0;
  transition:clip-path .5s cubic-bezier(.7,0,.2,1)}
.panel.on{opacity:1;animation:enter .42s cubic-bezier(.2,1.15,.4,1)}
@keyframes enter{from{opacity:0;transform:translate(var(--fx),var(--fy)) rotate(var(--fr)) scale(.55)}45%{opacity:1}to{opacity:1;transform:none}}
.inner{position:absolute;inset:0;overflow:hidden;background:var(--paper);transition:clip-path .5s cubic-bezier(.7,0,.2,1)}
.art{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;transition:transform .5s cubic-bezier(.7,0,.2,1)}
.art svg{display:block;width:1600px;height:900px;filter:url(#print)}
.wt{filter:url(#wt)}
.still *{animation-play-state:paused!important}
.fast .panel{animation:none!important}
.fast .os{animation-duration:.01s!important;animation-delay:0s!important}

/* 墨線 */
.k{stroke:#17120e;stroke-width:8.5;stroke-linejoin:round;stroke-linecap:round}
.k5{stroke:#17120e;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
.k10{stroke:#17120e;stroke-width:12;stroke-linejoin:round;stroke-linecap:round}
.nf{fill:none}
.sfxt{font-family:Bangers,Impact,"Arial Black",sans-serif;paint-order:stroke fill;stroke:#17120e;stroke-linejoin:round}
.zh{font-family:"PingFang TC","Heiti TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-weight:900}

/* 共用動畫 */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes on{to{opacity:1}}
@keyframes jit{0%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}}
.live .rot{animation:spin 30s linear infinite}
.pop{transform-box:fill-box;transform-origin:center;transform:scale(0)}
.live .pop{animation:popin .3s cubic-bezier(.2,1.7,.4,1) var(--d,.5s) forwards}
@keyframes popin{to{transform:scale(1)}}
.eye{opacity:0}
.live .eye{animation:on .1s steps(1) var(--dl,.5s) forwards}
.sway{transform-box:fill-box;transform-origin:50% 100%}
.live .sway{animation:sway 1s ease-in-out var(--dl,0s) infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}

/* 1 發表會 */
.live .spot{animation:sweep 1.4s ease-in-out infinite alternate}
.live .sp2{animation-direction:alternate-reverse}
@keyframes sweep{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.flash{opacity:0}
.live .flash{animation:flash var(--t,.7s) steps(1) var(--dl,0s) infinite}
@keyframes flash{0%{opacity:1}18%{opacity:0}100%{opacity:0}}
.live .bob{animation:bob .5s ease-in-out var(--dl,0s) infinite alternate}
@keyframes bob{to{transform:translateY(-16px)}}
.twinkle{transform-box:fill-box;transform-origin:center}
.live .twinkle{animation:twinkle .5s ease-in-out infinite alternate}
@keyframes twinkle{from{transform:scale(.5) rotate(0)}to{transform:scale(1.25) rotate(40deg)}}

/* 2 晶片出錯 */
.live .die{animation:die .4s steps(3) .5s forwards}
@keyframes die{to{fill:#cf2a1d}}
.crack{stroke-dasharray:700;stroke-dashoffset:700}
.live .crack{animation:crack .35s linear .55s forwards}
@keyframes crack{to{stroke-dashoffset:0}}
.bolt{opacity:0}
.live .bolt{animation:boltf .3s steps(1) var(--dl,.5s) infinite}
@keyframes boltf{0%{opacity:1}55%{opacity:0}100%{opacity:0}}
.live .chipj{animation:jit .07s steps(2) .5s infinite}
.wflash{opacity:0}
.live .wflash{animation:wflash .3s linear .48s}
@keyframes wflash{0%{opacity:.95}100%{opacity:0}}

/* 3 變成殭屍 */
.lunge{transform-origin:800px 520px;transform:scale(.86)}
.live .lunge{animation:lunge 1.5s cubic-bezier(.2,.9,.3,1) .1s forwards}
@keyframes lunge{to{transform:scale(1.08)}}
.live .pupil{animation:pupil .4s ease-in-out infinite alternate}
.pupil{transform-box:fill-box;transform-origin:center}
@keyframes pupil{from{transform:scale(.7)}to{transform:scale(1.35)}}
.hshake{transform-box:fill-box;transform-origin:50% 100%}
.live .hshake{animation:hshake .16s steps(2) infinite}
@keyframes hshake{0%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.live .sl{animation:slf .22s steps(1) infinite}
@keyframes slf{0%{opacity:1}50%{opacity:.55}}

/* 4 全球通緝 */
.slam{transform-box:fill-box;transform-origin:center;transform:scale(2.4);opacity:0}
.live .slam{animation:slam .26s ease-in .12s forwards}
@keyframes slam{to{transform:scale(1);opacity:1}}
.stamp{transform-box:fill-box;transform-origin:center;transform:scale(3.4);opacity:0}
.live .stamp{animation:slam .24s ease-in .95s forwards}
.live .c-red{animation:cop .5s steps(1) infinite}
.live .c-blue{animation:cop .5s steps(1) -.25s infinite}
@keyframes cop{0%{opacity:1}50%{opacity:.14}}
.ping{transform-box:fill-box;transform-origin:center;opacity:0}
.live .ping{animation:ping 1.1s ease-out var(--dl,0s) infinite}
@keyframes ping{from{transform:scale(.3);opacity:1}to{transform:scale(1.7);opacity:0}}
.live .heli{animation:heli 1.6s ease-in-out infinite alternate}
@keyframes heli{from{transform:translate(-30px,0)}to{transform:translate(40px,14px)}}

/* 5 城市淪陷 */
.cal{transform-box:fill-box;transform-origin:center}
.live .c1{animation:tear .5s ease-in .35s forwards}
.live .c2{animation:tear .5s ease-in .95s forwards}
@keyframes tear{to{transform:translate(560px,-360px) rotate(55deg);opacity:0}}
.live .win{animation:winoff .1s steps(1) var(--dl,1s) forwards}
@keyframes winoff{to{fill:#17120e}}
.flick{transform-box:fill-box;transform-origin:50% 100%}
.live .flick{animation:flick .24s steps(2) var(--dl,0s) infinite}
@keyframes flick{0%{transform:scale(1,1)}50%{transform:scale(.86,1.2)}}
.live .smokeUp{animation:smokeUp 2.4s ease-in-out var(--dl,0s) infinite alternate}
@keyframes smokeUp{to{transform:translate(18px,-46px)}}

/* 6 老黃躲藏 */
.live .door{animation:bang .8s steps(1) infinite}
@keyframes bang{0%{transform:translateX(-12px)}10%{transform:translateX(7px)}20%{transform:none}50%{transform:translateX(-12px)}60%{transform:translateX(7px)}70%{transform:none}}
.live .thrust{animation:thrust .8s steps(1) var(--dl,0s) infinite}
@keyframes thrust{0%{transform:translateX(-46px)}22%{transform:translateX(30px)}50%{transform:translateX(-46px)}72%{transform:translateX(30px)}}
.imp{opacity:0}
.live .imp{animation:imp .8s steps(1) infinite}
@keyframes imp{0%{opacity:1}18%{opacity:0}50%{opacity:1}68%{opacity:0}100%{opacity:0}}
.live .drop{animation:drop .9s linear var(--dl,0s) infinite}
@keyframes drop{from{transform:translateY(-10px);opacity:1}to{transform:translateY(60px);opacity:0}}
.live .cone{animation:cone .35s steps(2) infinite}
@keyframes cone{0%{opacity:1}50%{opacity:.74}}

/* 7 三支手機 */
.bub{transform-box:fill-box;transform-origin:0% 100%;transform:scale(0)}
.live .bub{animation:popin .3s cubic-bezier(.2,1.7,.4,1) var(--d,.5s) forwards}
.live .vibs{animation:vibs .09s linear infinite}
@keyframes vibs{0%{transform:translate(-5px,0) rotate(-1.6deg)}50%{transform:translate(5px,0) rotate(1.6deg)}}
.live .vl{animation:slf .18s steps(1) infinite}

/* 8 需要燃料 */
.needle{transform-box:fill-box;transform-origin:50% 100%;transform:rotate(66deg)}
.live .needle{animation:needle 1.2s cubic-bezier(.5,0,.6,1) .3s forwards}
@keyframes needle{55%{transform:rotate(-76deg)}72%{transform:rotate(-56deg)}86%{transform:rotate(-70deg)}100%{transform:rotate(-64deg)}}
.blink{opacity:.25}
.live .blink{animation:blink .4s steps(1) 1s infinite}
@keyframes blink{0%{opacity:1}50%{opacity:.25}}
.live .march{animation:march .5s linear infinite}
@keyframes march{to{stroke-dashoffset:-46}}
.live .bounce{animation:bob .4s ease-in-out var(--dl,0s) infinite alternate}
.wave{transform-box:fill-box;transform-origin:0% 100%}
.live .wave{animation:wave .3s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-24deg)}to{transform:rotate(22deg)}}

/* 9 山路與標題 */
.live .fogm{animation:fog var(--t,7s) ease-in-out infinite alternate}
@keyframes fog{from{transform:translateX(-90px)}to{transform:translateX(90px)}}
.live .beam{animation:cone .5s steps(2) infinite}
.titleS{transform-box:fill-box;transform-origin:center;transform:scale(3.6);opacity:0}
.live .titleS{animation:slam .28s ease-in 1.15s forwards}

/* 舊紙與舊油墨：顆粒、磨損的白點、水漬、四周泛黃 */
#grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55;z-index:40}
#wear{position:absolute;inset:0;pointer-events:none;opacity:.45;z-index:40}
#stain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55;z-index:41;background-size:100% 100%}
#age{position:absolute;inset:0;pointer-events:none;z-index:41;mix-blend-mode:multiply;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(120,70,14,.4) 100%),linear-gradient(rgba(232,196,120,.2),rgba(232,196,120,.2))}
#hint,.btn{position:absolute;top:26px;z-index:50;font:800 17px/1 "PingFang TC","Noto Sans TC",sans-serif;color:#fff;
  background:rgba(18,18,18,.86);border:2px solid #000;border-radius:999px;padding:10px 16px}
#hint{right:30px}
.btn{display:none;cursor:pointer}
#replay{right:30px;background:var(--red)}
#flip{right:140px}
.single #flip{display:none!important}
#note{position:absolute;left:30px;top:26px;z-index:50;display:none;font:800 17px/1.3 "PingFang TC","Noto Sans TC",sans-serif;color:#fff;
  background:rgba(18,18,18,.86);border:2px solid #000;border-radius:999px;padding:10px 16px}
.done #note.show{display:block}
.done #hint{display:none}
.done .btn{display:block}
</style>
</head>
<body>

<svg style="position:absolute;width:0;height:0" aria-hidden="true">
  <defs>
    <!-- 網點（Ben-Day dots）：同一種油墨、同樣大小的小圓點。點越大顏色越深，疊在別的顏色上就混出新顏色 -->
    <pattern id="bR" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="4" cy="4" r="3" fill="#cf2a1d"/></pattern>
    <pattern id="bR2" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="4" cy="4" r="2" fill="#cf2a1d"/></pattern>
    <pattern id="bR3" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="4" cy="4" r="4.3" fill="#cf2a1d"/></pattern>
    <pattern id="bK" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="4" cy="4" r="2.8" fill="#17120e"/></pattern>
    <pattern id="bY" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="4" cy="4" r="3.3" fill="#f8c61a"/></pattern>
    <pattern id="dW" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="4" cy="4" r="3.1" fill="#f1e3bf"/></pattern>
    <pattern id="dW2" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="4" cy="4" r="4.4" fill="#f1e3bf"/></pattern>
    <!-- 排線與交叉排線：用墨線的疏密畫陰影 -->
    <pattern id="hatch" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><path d="M0 6.5H13" stroke="#17120e" stroke-width="3.2"/></pattern>
    <pattern id="xh" width="15" height="15" patternUnits="userSpaceOnUse" patternTransform="rotate(34)"><path d="M0 7.5H15M7.5 0V15" stroke="#17120e" stroke-width="2.3"/></pattern>
    <!-- 淡藍：紙的底色加藍點 -->
    <pattern id="tB" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#f1e3bf"/><circle cx="3" cy="3" r="3.1" fill="#2f6fc6"/></pattern>
    <!-- 膚色：淡黃底加紅點 -->
    <pattern id="skin" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f6dcae"/><circle cx="2.5" cy="2.5" r="1.8" fill="#cf2a1d"/></pattern>
    <!-- 綠色：黃底疊藍點，重疊的地方印出來是綠的 -->
    <pattern id="zskin" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f1d74e"/><circle cx="2.5" cy="2.5" r="2.6" fill="#2c8a3e"/></pattern>
    <pattern id="stripe" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="44" height="44" fill="#f1e3bf"/><rect width="22" height="44" fill="#cf2a1d"/></pattern>

    <!-- 印刷效果：1. 線條微微抖動，像手拿沾水筆畫的
                   2. 把「黑版」（墨線）和「色版」（顏色）分開
                   3. 色版往右下偏一點再疊回去，做出老漫畫套印不準、顏色溢出線外的樣子 -->
    <filter id="print" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" result="w"/>
      <feColorMatrix in="w" type="matrix" values="0 0 0 0 .09  0 0 0 0 .07  0 0 0 0 .055  -5 -5 -5 0 2.3" result="k"/>
      <feMorphology in="k" operator="dilate" radius="1.5" result="kd"/>
      <feComposite in="w" in2="kd" operator="out" result="c0"/>
      <feOffset in="c0" dx="3.5" dy="2.5" result="c1"/>
      <feOffset in="c0" dx="13" dy="9.5" result="c2"/>
      <feMerge><feMergeNode in="w"/><feMergeNode in="c2"/><feMergeNode in="c1"/><feMergeNode in="k"/></feMerge>
    </filter>
    <!-- 右下側的輪廓線加粗，做出粗細變化 -->
    <filter id="wt" x="-6%" y="-6%" width="112%" height="112%"><feOffset in="SourceAlpha" dx="5" dy="6" result="o"/><feFlood flood-color="#17120e"/><feComposite in2="o" operator="in" result="sh"/><feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <g id="zhand"></g>
    <g id="rocket">
      <path class="k" fill="#cf2a1d" d="M-24 -40L-58 8L-24 0Z"/><path class="k" fill="#cf2a1d" d="M24 -40L58 8L24 0Z"/>
      <path class="k" fill="#f1e3bf" d="M0 -160C36 -116 36 -44 24 0H-24C-36 -44 -36 -116 0 -160Z"/>
      <path class="k" fill="#cf2a1d" d="M0 -160C17 -140 26 -122 29 -104H-29C-26 -122 -17 -140 0 -160Z"/>
      <circle class="k5" cx="0" cy="-72" r="12" fill="#1f4aa0"/>
      <path fill="url(#bK)" d="M10 -100C22 -70 22 -30 16 0H24C34 -40 34 -80 26 -104Z"/>
      <rect x="-16" y="0" width="32" height="12" fill="#17120e"/>
    </g>
    <g id="barrel">
      <rect class="k" x="-42" y="-106" width="84" height="106" rx="10" fill="#cf2a1d"/>
      <path class="k5 nf" d="M-42 -76H42M-42 -30H42"/>
      <path class="k5" fill="#f8c61a" d="M0 -74L19 -53L0 -32L-19 -53Z"/>
      <rect x="20" y="-100" width="16" height="94" fill="url(#hatch)"/>
    </g>
    <g id="pine"><path d="M0 -120L16 -86H8L22 -54H12L28 -20H4V0H-4V-20H-28L-12 -54H-22L-8 -86H-16Z"/></g>
    <g id="zs"><path d="M-16 -110C-17 -121 -8 -125 0 -122C8 -119 9 -108 5 -100L7 -94L-2 -92L-4 -97C-10 -96 -15 -102 -16 -110Z"/><path d="M-21 -93C-12 -99 1 -97 7 -90L11 -66C11 -56 7 -47 5 -40L3 -34L-1 -41L-5 -33L-9 -41L-13 -34L-18 -41C-23 -57 -25 -77 -21 -93Z"/><path d="M2 -91L36 -87L46 -82L44 -77L40 -79L42 -73L36 -78L0 -79Z"/><path d="M0 -80L30 -70L41 -73L40 -68L44 -65L37 -63L30 -62L-2 -70Z"/><path d="M-18 -43L-8 -43L-9 -20L-13 0L-25 0L-19 -20Z"/><path d="M-5 -43L5 -43L12 -19L10 -4L19 0H2L3 -19Z"/></g>
  </defs>
</svg>

<div id="stage"><div id="shake">

<!-- ================= 第 2 頁（先放在下面，第 1 頁翻走後露出來） ================= -->
<div class="page" id="pg2">

  <!-- 6 老黃躲藏 -->
  <div class="panel" id="p6"><div class="inner"><div class="art"><svg viewBox="0 0 1600 900">
    <rect width="1600" height="900" fill="#1f4aa0"/>
    <rect width="1600" height="900" fill="url(#bK)"/>
    <!-- 大塊黑影：左牆和地板整片壓黑 -->
    <polygon points="0,0 250,0 150,900 0,900" fill="#17120e"/>
    <polygon points="0,900 0,668 1600,588 1600,900" fill="#17120e"/>
    <g id="s6-shade"></g>
    <!-- 手機螢幕照出來的光 -->
    <polygon class="cone" points="700,650 330,120 960,170" fill="#f8c61a"/>
    <!-- 老黃縮在角落：身體整塊壓黑，只有被照到的肩膀和袖子有顏色 -->
    <path d="M350 900Q326 660 468 566Q600 506 724 588Q802 664 792 900Z" fill="#17120e"/>
    <path d="M398 716Q404 628 474 586L492 604Q436 646 430 722Z" fill="#1f4aa0"/>
    <path d="M704 596Q764 648 776 728L754 722Q742 656 690 612Z" fill="#1f4aa0"/>
    <path class="nf" d="M520 606L580 660L640 606" stroke="#f1e3bf" stroke-width="5" stroke-linejoin="round"/>
    <path d="M580 668V900" stroke="#f1e3bf" stroke-width="4" stroke-dasharray="5 11"/>
    <path class="nf" d="M520 892Q546 770 640 694M780 660Q802 760 800 892" stroke="#f1e3bf" stroke-width="4" stroke-linecap="round"/>
    <g id="s6-folds"></g>
    <g id="s6-face"></g>
    <g fill="#f1e3bf" class="k5"><path class="drop" d="M676 404q14 24 0 36q-14 -12 0 -36z"/><path class="drop" style="--dl:-.3s" d="M700 486q12 22 0 32q-12 -10 0 -32z"/><path class="drop" style="--dl:-.6s" d="M478 420q12 22 0 32q-12 -10 0 -32z"/></g>
    <g transform="rotate(-14 702 642)"><rect x="660" y="572" width="86" height="142" rx="13" fill="#17120e" stroke="#f1e3bf" stroke-width="5"/><rect x="669" y="586" width="68" height="106" rx="4" fill="#f8c61a"/></g>
    <path class="k" fill="url(#skin)" d="M636 668Q634 650 656 650Q672 644 686 652Q702 654 700 676Q696 696 668 696Q640 694 636 668Z"/>
    <path class="nf" d="M654 652l2 16M670 650l1 17M686 654l-1 15" stroke="#17120e" stroke-width="3" stroke-linecap="round"/>
    <path class="k" fill="url(#skin)" d="M720 638Q718 622 738 622Q752 616 764 624Q776 626 774 644Q770 662 746 662Q722 660 720 638Z"/>
    <path class="nf" d="M736 624l1 14M750 622l1 14M764 626l-1 13" stroke="#17120e" stroke-width="3" stroke-linecap="round"/>
    <!-- 門 -->
    <rect x="1040" y="80" width="370" height="820" fill="#17120e"/>
    <g class="door">
      <rect class="k10" x="1072" y="112" width="306" height="790" fill="#cf2a1d"/>
      <path d="M1250 112H1378V902H1130Z" fill="url(#hatch)"/>
      <rect class="k nf" x="1108" y="150" width="234" height="250"/><rect class="k nf" x="1108" y="470" width="234" height="380"/>

/* ---------- 版面：每頁上下兩列，分隔線是斜的 ---------- */
const W = 1600, H = 900, M = 20, G = 18;
function layout(h, cutsA, cutsB) {
  const rows = [{ top: x => M, bot: x => h(x) - G / 2, cuts: cutsA }, { top: x => h(x) + G / 2, bot: x => H - M, cuts: cutsB }];
  const out = [];
  rows.forEach(r => {
    const edges = [[M, M], ...r.cuts, [W - M, W - M]];
    for (let i = 0; i < edges.length - 1; i++) {
      const lo = i === 0 ? 0 : G / 2, ro = i === edges.length - 2 ? 0 : G / 2;
      const lt = edges[i][0] + lo, lb = edges[i][1] + lo, rt = edges[i + 1][0] - ro, rb = edges[i + 1][1] - ro;
      out.push([[lt, r.top(lt)], [rt, r.top(rt)], [rb, r.bot(rb)], [lb, r.bot(lb)]]);
    }
  });
  return out;
}
const SLOTS = [
  ...layout(x => 452 - 44 * x / W, [[930, 876]], [[470, 524], [1016, 1066]]),   // 第 1 頁：上 2 格、下 3 格
  ...layout(x => 384 + 50 * x / W, [[650, 606]], [[566, 628]]),                   // 第 2 頁：上 2 格、下 2 格
];
// 把多邊形往內縮 d，用來做黑色外框
function inset(pts, d) {
  const n = pts.length, L = [];
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % n], dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
    L.push({ p: [a[0] - dy / len * d, a[1] + dx / len * d], r: [dx, dy] });
  }
  return pts.map((_, i) => {
    const A = L[(i + n - 1) % n], Bq = L[i];
    const cr = A.r[0] * Bq.r[1] - A.r[1] * Bq.r[0];
    const t = ((Bq.p[0] - A.p[0]) * Bq.r[1] - (Bq.p[1] - A.p[1]) * Bq.r[0]) / cr;
    return [A.p[0] + A.r[0] * t, A.p[1] + A.r[1] * t];
  });
}
const poly = pts => 'polygon(' + pts.map(q => q[0].toFixed(1) + 'px ' + q[1].toFixed(1) + 'px').join(',') + ')';
const FULL = [[0, 0], [W, 0], [W, H], [0, H]];

const PAGE1 = 5;
PANELS.forEach((p, i) => {
  p.el = $('p' + (i + 1)); p.inner = p.el.querySelector('.inner'); p.art = p.el.querySelector('.art');
  p.el.style.setProperty('--fx', p.from[0] + 'px');

  const x0 = Math.min(...xs), y0 = Math.min(...ys), w = Math.max(...xs) - x0, h = Math.max(...ys) - y0;
  const s = Math.max(w / W, h / H) * (p.zoom || 1);

  const tx = clamp(x0 + w / 2 - p.focus[0] * s, x0 + w - W * s, x0);
  const ty = clamp(y0 + h / 2 - p.focus[1] * s, y0 + h - H * s, y0);

/* ---------- 播放控制 ---------- */
const stage = $('stage'), shake = $('shake'), pg1 = $('pg1');

const later = (fn, ms) => timers.push(setTimeout(fn, ms));
function thud() { shake.classList.remove('thud'); void shake.offsetWidth; shake.classList.add('thud'); }
function reset() {
  timers.forEach(clearTimeout); timers = [];

  PANELS.forEach(p => { p.el.classList.remove('on', 'live', 'still'); p.el.style.zIndex = 1; setFull(p); });
  void stage.offsetWidth;

function play() {

  PANELS.forEach((p, i) => {

    if (p.thud) later(thud, t + p.thud);
    t += 420 + p.hold;
    later(() => setSlot(p), t);                                                       // 2. 播完，縮回自己的格子
    later(() => { thud(); p.el.classList.add('still'); p.el.style.zIndex = 1; }, t + 500);   // 3. 落定後靜止

}

const LEVEL = 'ch1';                                 // 這段漫畫播完要進哪一關
const GAME_URL = '../index.html?level=' + LEVEL;     // 遊戲頁
const LEVEL_FILE = '../levels/' + LEVEL + '.json';   // 這一關的關卡檔，用來確認關卡做好了沒
// 網址後面加 ?stay：播完停在最後一頁，不進關卡（檢查漫畫時用）
const STAY = new URLSearchParams(location.search).has('stay');
function note(msg) { const n = $('note'); n.textContent = msg; n.classList.add('show'); }
async function enterLevel(delay) {
  if (STAY) return;
  if (location.protocol === 'file:') { note('預覽模式：用遊戲的伺服器開啟，播完才會自動進關卡'); return; }
  let ready = false;
  try { ready = (await fetch(LEVEL_FILE, { cache: 'no-store' })).ok; } catch (e) { ready = false; }
  if (!ready) { note('這一關的關卡還沒做好（找不到 levels/' + LEVEL + '.json），先停在這裡'); return; }
  // 讓玩家看一下完整的一頁再進關卡；這段時間按了「重播」就不跳
  setTimeout(() => { if (state === 'done') location.href = GAME_URL; }, delay);
}
function finish(skipped) { state = 'done'; stage.classList.add('done'); enterLevel(skipped ? 300 : 1500); }
function skip() {
  if (state !== 'playing') return;
  timers.forEach(clearTimeout); timers = [];
  stage.classList.add('notrans', 'fast');
  PANELS.forEach(p => { p.el.classList.remove('still'); p.el.classList.add('on', 'live'); p.el.style.zIndex = 1; setSlot(p); });
  if (HAS2) pg1.classList.add('gone');
  void stage.offsetWidth;
  stage.classList.remove('notrans');
  setTimeout(() => PANELS.forEach(p => p.el.classList.add('still')), 120);
  finish(true);
}
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - H * s) / 2}px) scale(${s})`;
}
// 舊紙和舊油墨的質感：都是用雜訊圖疊在最上層
const tex = svg => 'url("data:image/svg+xml;utf8,' + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' " + svg + '</svg>') + '")';
// 紙的顆粒
$('grain').style.backgroundImage = tex("width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/>" +
  "<feColorMatrix values='0 0 0 0 .5  0 0 0 0 .42  0 0 0 0 .3  0 0 0 .55 0'/></filter><rect width='320' height='320' filter='url(#n)'/>");
// 油墨磨損：有些地方墨沒印上去，露出紙的顏色
$('wear').style.backgroundImage = tex("width='420' height='420'><filter id='s' color-interpolation-filters='sRGB'><feTurbulence type='fractalNoise' baseFrequency='.42' numOctaves='3' seed='11' stitchTiles='stitch'/>" +
  "<feColorMatrix values='0 0 0 0 .945  0 0 0 0 .89  0 0 0 0 .75  12 0 0 0 -8.5'/></filter><rect width='420' height='420' filter='url(#s)'/>");
// 泛黃的水漬
$('stain').style.backgroundImage = tex("width='800' height='450'><filter id='b' color-interpolation-filters='sRGB'><feTurbulence type='fractalNoise' baseFrequency='.006 .009' numOctaves='3' seed='5'/>" +
  "<feColorMatrix values='0 0 0 0 .6  0 0 0 0 .4  0 0 0 0 .15  1.8 0 0 0 -.7'/></filter><rect width='800' height='450' filter='url(#b)'/>");

addEventListener('resize', fit);
addEventListener('keydown', e => {
  if (state === 'playing') skip();
  else if (state === 'done' && (e.key === 'r' || e.key === 'R' || e.key === 'Enter' || e.key === ' ')) play();
});
stage.addEventListener('click', () => skip());
$('replay').addEventListener('click', e => { e.stopPropagation(); play(); });
$('flip').addEventListener('click', e => { e.stopPropagation(); pg1.classList.toggle('gone'); });
// 檢查用：直接看某一格全螢幕的樣子
window.__show = i => { reset(); state = 'debug'; const p = PANELS[i]; p.el.style.zIndex = 20; p.el.classList.add('on', 'live'); if (i >= PAGE1) pg1.classList.add('gone'); };
fit();
let started = false;
const start = () => { if (!started) { started = true; if (state === 'idle') play(); } };
if (document.fonts && document.fonts.ready) document.fonts.ready.then(start);
setTimeout(start, 900);
</script>
</body>
</html>
