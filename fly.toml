# Fly.io config for the co-op game server (README "線上多人").
# `fly launch --no-deploy` asks for an app name and rewrites `app` below; then `fly deploy`.
app = "huang-not-found"
primary_region = "nrt" # Tokyo

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  # Rooms live in memory: a stopped machine loses every team, and waking up costs seconds.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
